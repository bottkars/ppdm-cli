name: Release to Public Repository

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 20.1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: quay.io
  IMAGE_NAME: delldps/ppdm-cli

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: |
          make build-all-platforms

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: binaries
          path: dist/
          retention-days: 7

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: dist/

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create release checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt
          sha512sum * > sha512sums.txt

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          # PPDM CLI ${{ env.VERSION }}
          
          ## 🚀 What's New
          
          This release includes:
          - Enhanced backup and restore operations
          - Improved filtering capabilities
          - Web monitoring interface
          - Comprehensive command documentation
          
          ## 📦 Installation
          
          ### Binary Download
          Download the appropriate binary for your platform:
          
          ```bash
          # Linux AMD64
          wget https://github.com/bottkars/ppdm-cli/releases/download/v${{ env.VERSION }}/ppdm-cli-linux-amd64
          chmod +x ppdm-cli-linux-amd64
          sudo mv ppdm-cli-linux-amd64 /usr/local/bin/ppdm-cli
          
          # macOS AMD64
          wget https://github.com/bottkars/ppdm-cli/releases/download/v${{ env.VERSION }}/ppdm-cli-darwin-amd64
          chmod +x ppdm-cli-darwin-amd64
          sudo mv ppdm-cli-darwin-amd64 /usr/local/bin/ppdm-cli
          
          # Windows AMD64
          wget https://github.com/bottkars/ppdm-cli/releases/download/v${{ env.VERSION }}/ppdm-cli-windows-amd64.exe
          # Add to PATH
          ```
          
          ### ORAS Registry
          Download using ORAS:
          
          ```bash
          # Install ORAS
          curl -LO https://github.com/oras-project/oras/releases/download/v0.16.0/oras_0.16.0_linux_amd64.tar.gz
          tar -xzf oras_0.16.0_linux_amd64.tar.gz
          
          # Download PPDM CLI
          oras pull quay.io/delldps/ppdm-cli:${{ env.VERSION }}-linux-amd64
          ```
          
          ### Docker
          ```bash
          docker run --rm -it quay.io/delldps/ppdm-cli:${{ env.VERSION }} version
          ```
          
          ## 🔧 Verification
          
          Verify the downloaded binary:
          
          ```bash
          ppdm-cli version
          # Expected: PPDM CLI Version: ${{ env.VERSION }}
          ```
          
          ## 📋 Platform Support
          
          - ✅ Linux (AMD64, ARM64)
          - ✅ macOS (AMD64, ARM64)
          - ✅ Windows (AMD64)
          - ✅ FreeBSD (AMD64)
          
          ## 📚 Documentation
          
          Full documentation is available at: https://github.com/bottkars/ppdm-cli#readme
          
          EOF

      - name: Create GitHub Release (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN: Would create release v${{ env.VERSION }}"
          echo "📁 Files to upload:"
          ls -la dist/
          echo "📝 Release notes:"
          cat release_notes.md

      - name: Create GitHub Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: PPDM CLI v${{ env.VERSION }}
          body_path: release_notes.md
          files: |
            dist/*
            dist/sha256sums.txt
            dist/sha512sums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  push-to-oras:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: binaries
          path: dist/

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Login to Quay.io
        if: github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Push to ORAS Registry (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN: Would push binaries to ORAS registry"
          echo "📦 Images to push:"
          for binary in dist/ppdm-cli-*; do
            platform=$(echo $binary | sed 's/.*ppdm-cli-\(.*\)/\1/')
            echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-$platform"
          done

      - name: Push to ORAS Registry
        if: github.event.inputs.dry_run != 'true'
        run: |
          # Install ORAS
          curl -LO https://github.com/oras-project/oras/releases/download/v0.16.0/oras_0.16.0_linux_amd64.tar.gz
          tar -xzf oras_0.16.0_linux_amd64.tar.gz
          sudo mv oras /usr/local/bin/

          # Push each platform binary
          for binary in dist/ppdm-cli-*; do
            platform=$(echo $binary | sed 's/.*ppdm-cli-\(.*\)/\1/')
            echo "📦 Pushing ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-$platform"
            
            # Create ORAS manifest
            cat > manifest.json << EOF
          {
            "mediaType": "application/vnd.oci.image.layer.v1.tar+gzip",
            "digest": "sha256:$(sha256sum $binary | cut -d' ' -f1)",
            "size": $(stat -c%s $binary),
            "annotations": {
              "org.opencontainers.image.title": "ppdm-cli",
              "org.opencontainers.image.version": "${{ env.VERSION }}",
              "org.opencontainers.image.platform": "$platform",
              "org.opencontainers.image.created": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            }
          }
          EOF
            
            # Push to registry
            oras push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-$platform \
              $binary:application/vnd.oci.image.layer.v1.tar+gzip \
              manifest.json:application/vnd.oci.image.config.v1+json
          done

          # Push latest tags
          for binary in dist/ppdm-cli-*; do
            platform=$(echo $binary | sed 's/.*ppdm-cli-\(.*\)/\1/')
            echo "📦 Tagging ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-$platform"
            
            oras tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}-$platform latest-$platform
          done

  sync-documentation:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Setup Git for public repo
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "PPDM CLI Release Bot"
          git config --global user.email "release-bot@bottkars.com"

      - name: Clone public repository
        if: github.event.inputs.dry_run != 'true'
        uses: actions/checkout@v4
        with:
          repository: bottkars/ppdm-cli
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public-repo

      - name: Prepare documentation (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN: Would prepare and sync documentation"
          echo "📁 Documentation files to copy:"
          find Documentation/ -name "*.md" | head -10

      - name: Prepare documentation
        if: github.event.inputs.dry_run != 'true'
        run: |
          # Create public documentation structure
          mkdir -p public-repo/docs
          mkdir -p public-repo/docs/commands
          
          # Copy main documentation
          cp Documentation/COMMAND_REFERENCE.md public-repo/docs/
          cp Documentation/README.md public-repo/docs/README.md 2>/dev/null || true
          
          # Copy command documentation
          cp Documentation/commands/*.md public-repo/docs/commands/ 2>/dev/null || true
          
          # Create public README (already exists, but update if needed)
          echo "✅ Documentation prepared for sync"

      - name: Commit and push to public repo (Dry Run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "🔍 DRY RUN: Would commit and push to public repository"
          cd public-repo
          echo "📁 Files to commit:"
          git status --porcelain
          echo "📝 Commit message:"
          echo "Release v${{ env.VERSION }} - Documentation and binaries"

      - name: Commit and push to public repo
        if: github.event.inputs.dry_run != 'true'
        run: |
          cd public-repo
          
          # Add all changes
          git add .
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Release v${{ env.VERSION }} - Documentation and binaries"
            
            # Push to public repository
            git push origin main
            
            echo "✅ Documentation synced to public repository"
          fi

  notify-release:
    needs: [create-release, push-to-oras, sync-documentation]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Release Summary
        run: |
          echo "## 🚀 PPDM CLI Release v${{ env.VERSION }} Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Tasks:" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Built binaries for all platforms" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Created GitHub release" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Pushed to ORAS registry" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Synced documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Distribution:" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases**: https://github.com/bottkars/ppdm-cli/releases/tag/v${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **ORAS Registry**: quay.io/delldps/ppdm-cli:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Documentation**: https://github.com/bottkars/ppdm-cli" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [Download Binaries](https://github.com/bottkars/ppdm-cli/releases/tag/v${{ env.VERSION }})" >> $GITHUB_STEP_SUMMARY
          echo "- [View Documentation](https://github.com/bottkars/ppdm-cli)" >> $GITHUB_STEP_SUMMARY
          echo "- [ORAS Registry](https://quay.io/repository/delldps/ppdm-cli)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Release v${{ env.VERSION }} failed!" >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
